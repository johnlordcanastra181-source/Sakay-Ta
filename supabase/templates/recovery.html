<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sakay Ta — Verification Code</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #1b2838; line-height: 1.6; max-width: 520px; margin: 0 auto; padding: 24px;">
    <h2 style="color: #1b2838; margin-bottom: 12px;">Sakay Ta Password Verification Code</h2>
    <p>Use the 6-digit verification code below to verify your email and update your Sakay Ta password:</p>
    <div style="background: #f4f6f9; border: 1px solid #d7dee8; border-radius: 10px; padding: 18px; text-align: center; margin: 20px 0;">
      <span style="font-size: 28px; font-weight: bold; letter-spacing: 6px; color: #1b2838;">{{ .Token }}</span>
    </div>
    <p style="font-size: 13px; color: #5a6a7e;">
      Enter this 6-digit code in the Sakay Ta app or Admin Portal. If you did not request a password change or reset, you can safely ignore this email.
    </p>
  </body>
</html>
